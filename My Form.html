<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h2>Registration Form</h2>

    <form>
      <label>Full Name:</label><br>
      <input type="text"name="fullname"><br><br>

      <label>Email:</label><br>
      <input type="email" name="email"><br><br>

      <label>Username:</label><br>
      <input type="text"name="username"><br><br>

      <label>Password:</label><br>
      <input type="password"
      name="password"><br><br>

      <label>Gender:</label><br>
       <input type="radio" name="gender" value=Male> Male <br><br>
       <input type="radio" name="gender" value=Female> Female <br><br>
        <br><br>


    <label>Grade Level</label><br>
     <select name="grade">
     <option value="Grade 7">Grade 7</option><br>
    
     <option value="Grade 8">Grade 8</option><br>
     
     <option value="Grade 9">Grade 9</option><br>
     
     <option value="Grade 10">Grade 10</option><br>
     
     <option value="Grade 11">Grade 11</option><br>
     
     <option value="Grade 12">Grade 12</option><br>
        </select>

        <br><br>
    <button type="submit">Submit</button>
    </form>
        
</body>
</html>
        

</body>
</html>
